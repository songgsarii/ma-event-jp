<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mastercard × Japan Seasonal Sake — Demo</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page" style="max-width:390px;margin:0 auto;">
    <header class="hero">
      <div class="logo-wrap">
        <img src="마스터카드 로고.png" alt="Mastercard logo" class="mast-logo">
      </div>
      <div class="hero-inner">
        <h1 class="hero-title">
          <span class="hero-copy">
            <span class="part1">겨울에만 만날 수 있는</span>
            <span class="part2"> <span class="highlight">나마자케</span>(생사케)에 대해 알아보세요</span>
          </span>
        </h1>
        <p class="hero-sub">지역별 나마자케를 따라 떠나는 겨울 일본 여행</p>
      </div>
    </header>

    <section id="map-section" class="map-section map-bg">
      <div class="map-inner">
        <h2 class="section-title">일본 나마자케 지도</h2>
        <p class="map-hint">지도에서 지역을 선택해보세요.</p>

        <div class="map-wrap">
          <svg id="jp-map" viewBox="0 0 360 900" preserveAspectRatio="xMidYMid meet" class="jp-map" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Japan map with sake regions">
            <rect width="360" height="900" rx="18" fill="#eef6fb" />
            <!-- Minimal, recognizable Japan silhouette paths for main islands -->
            <!-- Hokkaido -->
            <path id="is-hokkaido" d="M210 48c8-6 18-8 28-6c10 2 20 8 26 16c6 8 8 18 6 28c-2 10-8 18-14 24c-6 6-16 10-26 8c-10-2-20-8-26-14c-6-6-8-16-6-26c2-10 8-20 12-30z" fill="#ffffff" stroke="#c8dfee" stroke-width="1"/>
            <!-- Honshu (simplified but recognizable elongated shape) -->
            <path id="is-honshu" d="M220 120c30-8 60-4 86 12c20 12 36 28 44 50c8 22 6 44-2 66c-8 22-26 40-48 52c-22 12-48 18-74 14c-26-4-48-16-64-34c-16-18-24-42-22-68c2-26 12-52 30-72c18-20 40-34 68-40z" fill="#ffffff" stroke="#c8dfee" stroke-width="1"/>
            <!-- Shikoku -->
            <path id="is-shikoku" d="M200 420c18-6 36-2 50 8c12 10 18 24 18 38c0 14-6 28-18 36c-12 8-30 10-44 4c-14-6-24-18-26-34c-2-16 6-34 20-52z" fill="#ffffff" stroke="#c8dfee" stroke-width="1"/>
            <!-- Kyushu -->
            <path id="is-kyushu" d="M160 520c14-8 32-8 46 0c14 8 24 24 28 40c4 16 2 34-8 46c-10 12-26 18-42 16c-16-2-30-12-38-26c-8-14-8-30 0-48c8-18 20-30 14-24z" fill="#ffffff" stroke="#c8dfee" stroke-width="1"/>

            <!-- Pins positioned approximately relative to island shapes -->
            <g class="pins" aria-hidden="false">
              <!-- Akita (Honshu north-east coast) -->
              <g class="pin" data-id="akita" transform="translate(275,180)" role="button" tabindex="0" aria-label="Akita">
                <circle class="hit" r="20" fill="transparent" />
                <circle r="6" class="pin-core" fill="#0b2340" />
                <circle r="12" class="pin-bg" fill="#fff" stroke="#cbdff0" stroke-width="1.5" />
                <text class="pin-label" x="22" y="6">AKITA</text>
              </g>
              <!-- Yamagata (just south of Akita) -->
              <g class="pin" data-id="yamagata" transform="translate(260,210)" role="button" tabindex="0" aria-label="Yamagata">
                <circle class="hit" r="20" fill="transparent" />
                <circle r="6" class="pin-core" fill="#0b2340" />
                <circle r="12" class="pin-bg" fill="#fff" stroke="#cbdff0" stroke-width="1.5" />
                <text class="pin-label" x="22" y="6">YAMAGATA</text>
              </g>
              <!-- Niigata (west coast of Honshu, central north) -->
              <g class="pin" data-id="niigata" transform="translate(200,205)" role="button" tabindex="0" aria-label="Niigata">
                <circle class="hit" r="20" fill="transparent" />
                <circle r="6" class="pin-core" fill="#0b2340" />
                <circle r="12" class="pin-bg" fill="#fff" stroke="#cbdff0" stroke-width="1.5" />
                <text class="pin-label" x="22" y="6">NIIGATA</text>
              </g>
              <!-- Nagano (inland south of Niigata) -->
              <g class="pin" data-id="nagano" transform="translate(210,260)" role="button" tabindex="0" aria-label="Nagano">
                <circle class="hit" r="20" fill="transparent" />
                <circle r="6" class="pin-core" fill="#0b2340" />
                <circle r="12" class="pin-bg" fill="#fff" stroke="#cbdff0" stroke-width="1.5" />
                <text class="pin-label" x="22" y="6">NAGANO</text>
              </g>
              <!-- Kyoto (central-west Honshu) -->
              <g class="pin" data-id="kyoto" transform="translate(150,340)" role="button" tabindex="0" aria-label="Kyoto">
                <circle class="hit" r="20" fill="transparent" />
                <circle r="6" class="pin-core" fill="#0b2340" />
                <circle r="12" class="pin-bg" fill="#fff" stroke="#cbdff0" stroke-width="1.5" />
                <text class="pin-label" x="22" y="6">KYOTO</text>
              </g>
              <!-- Hiroshima (western Honshu) -->
              <g class="pin" data-id="hiroshima" transform="translate(110,390)" role="button" tabindex="0" aria-label="Hiroshima">
                <circle class="hit" r="20" fill="transparent" />
                <circle r="6" class="pin-core" fill="#0b2340" />
                <circle r="12" class="pin-bg" fill="#fff" stroke="#cbdff0" stroke-width="1.5" />
                <text class="pin-label" x="22" y="6">HIROSHIMA</text>
              </g>
            </g>
          </svg>
        </div>

        <div id="region-card" class="region-card large-card">
          <div class="region-header">
            <h3 id="region-name"></h3>
          </div>
          <div id="region-content" class="region-content"></div>
        </div>
      </div>
    </section>

    <!-- Brewery section removed per design -->

    <section class="promo">
      <h3 class="promo-title">마시고 싶은 사케를 찾았다면, 이제 그 지역으로 떠나보세요.</h3>
      <p class="promo-desc">일본 겨울 여행을 준비하고 있다면 Rakuten Travel에서 해당 지역의 숙박을 확인해보세요.</p>
      <a class="btn-cta" href="https://travel.rakuten.com/kor/ko-kr/" target="_blank" rel="noopener noreferrer">Rakuten Travel에서 여행 보기</a>
    </section>

    <footer class="site-footer">
      <div class="logo">Mastercard</div>
      <div class="muted">프로모션 예시 페이지</div>
      <nav class="footer-links">
        <a href="#">이용약관</a>
        <span>© Mastercard</span>
      </nav>
    </footer>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
